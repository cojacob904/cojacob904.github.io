<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Local Weekly Weather</h1>
        <p>Click the button below to get the 7-day forecast for your current location.</p>
        <!-- Geolocation Trigger -->
        <button id="getLocationBtn">Get My Weather</button>
        <p id="statusMessage"></p>
    </div>

    <!-- Container for the styled cards -->
    <div id="weatherContainer" class="weather-container"></div>

    <script src="script.js"></script>
</body>
</html>
